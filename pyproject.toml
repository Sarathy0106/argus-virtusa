[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — Agentic Regulatory & Risk Guard with Unified Safety"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "cryptography>=43.0.3",
    "networkx>=3.4.2",
    "duckdb>=1.1.0",
    "pdfplumber>=0.11.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.2",
    "shap>=0.46.0",
    "pandas>=2.2.3",
    "numpy>=2.1.2",
    "streamlit>=1.39.0",
    "langgraph>=0.2.39",
    "langchain-core>=0.3.12",
    "mcp>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "click>=8.1.7",
    "rich>=13.9.4",
    "tenacity>=9.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.1",
    "mypy>=1.13.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "services"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402", "UP017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
